description: This Dandiset contains mouse hippocampal dorsal CA1 electrophysiology
  and behavioral data acquired during delayed non-match-to-place (DNMP), open-field,
  and related foraging experiments. Data include sorted spike times (using MountainSort4),
  LFP, position tracking, trial intervals, consummatory and other behavioral event
  annotations.
